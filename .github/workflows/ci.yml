name: BlueToothRot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dsp-tests:
    name: Python DSP Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python3 -m pip install -r requirements.txt

      - name: Run the README quickstart
        run: |
          python3 scripts/test_bluetooth_dsp.py --output degraded.wav --distance 0.75 --codec sbc --headphone earbuds
          python3 - <<'PY'
          import os, wave
          path = "degraded.wav"
          with wave.open(path) as w:
              assert w.getnchannels() == 2, w.getnchannels()
              assert w.getsampwidth() == 2, w.getsampwidth()
              assert w.getframerate() == 44100, w.getframerate()
              assert w.getnframes() == 220500, w.getnframes()
          size = os.path.getsize(path)
          assert size == 882044, size
          PY

      - name: Run DSP Tests
        run: |
          python3 -m unittest discover tests

  build-juce-plugin:
    name: Build JUCE Plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libopengl-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 & Standalone
        run: |
          cmake --build build --config Release -j 2

      - name: Upload Linux Artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: BlueToothRot-Linux
          path: build/BlueToothRot_artefacts/Release/
          if-no-files-found: error

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: BlueToothRot-Windows
          path: build/BlueToothRot_artefacts/Release/
          if-no-files-found: error
